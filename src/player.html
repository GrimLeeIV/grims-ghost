<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{NAME}} · Grim's Ghost</title>
<style>
:root{--bg:#0e0f12;--panel:#1a1c22f2;--line:#2c2f38;--fg:#e8e9ee;--dim:#8b8f9c;--accent:#ff4040}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:64px 24px 56px;display:flex;align-items:center;justify-content:center}
video{max-width:100%;max-height:100%;border-radius:8px;background:#000;box-shadow:0 10px 40px #000c;outline:none}
#top{position:fixed;right:16px;top:14px;display:flex;gap:8px;align-items:center;z-index:2}
#name{color:var(--dim);margin-right:6px;max-width:50vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;font:inherit}
.btn:hover{border-color:#575b66}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
#tracks{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);color:var(--dim);font-size:12px;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#tracks b{color:var(--fg);font-weight:600}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);padding:10px 14px;display:none;z-index:4;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:10px}
#toast a{color:#ff9a9a;margin-left:12px;cursor:pointer;text-decoration:underline}
#logo{position:fixed;left:18px;top:18px;color:var(--dim);font-weight:600;letter-spacing:.3px}
#logo span{color:var(--accent)}
</style>
</head>
<body>
<div id="logo"><span>Grim's</span> Ghost</div>
<div id="top">
  <span id="name">{{NAME}}</span>
  <button class="btn" id="out" title="Open the folder it's saved in">Output folder</button>
  <button class="btn primary" id="save" title="Save a copy somewhere else (Ctrl+S)">Save as…</button>
</div>
<div id="stage"><video id="v" src="/media/{{TOKEN}}" controls autoplay playsinline preload="metadata"></video></div>
<div id="tracks">{{TRACKS}}</div>
<div id="toast"></div>
<script>
"use strict";
const TOKEN = "{{TOKEN}}", $ = id => document.getElementById(id);
let toastTimer, saving = false;
function toast(msg, withReveal) {
  const t = $("toast"); t.textContent = msg;
  if (withReveal) { const a = document.createElement("a"); a.textContent = "Show in folder"; a.onclick = reveal; t.appendChild(a); }
  t.style.display = "block"; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 5000);
}
const reveal = () => fetch("/reveal/" + TOKEN, { method: "POST" }).catch(() => toast("Couldn't open the folder. Is Grim's Ghost still running?"));
async function saveAs() {
  if (saving) return;
  saving = true; $("save").disabled = true; $("save").textContent = "Opening save window…";
  const slow = setTimeout(() => { if (saving) toast("The save window is open. If you can't see it, check your taskbar."); }, 2500);
  try {
    const j = await (await fetch("/savecopy/" + TOKEN, { method: "POST" })).json();
    if (!j.cancelled) toast("Saved as " + j.name, true);
  } catch (e) { toast("Couldn't save: " + e.message + ". Is Grim's Ghost still running?"); }
  finally { clearTimeout(slow); saving = false; $("save").disabled = false; $("save").textContent = "Save as…"; }
}
$("out").onclick = reveal;
$("save").onclick = saveAs;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveAs(); } });
</script>
</body>
</html>
